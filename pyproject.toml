[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labview-mcp"
version = "0.28.0"
description = "MCP server that lets AI coding agents (Claude Code, Codex, Cursor...) read, render, run and create NI LabVIEW VIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noah Lim" }]
keywords = ["labview", "mcp", "claude", "ni", "automation", "ai-agent"]
dependencies = [
    "mcp>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pillow>=10",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/shlim-t/labview-mcp"
Issues = "https://github.com/shlim-t/labview-mcp/issues"

[project.scripts]
labview-mcp = "labview_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labview_mcp"]
