[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labview-mcp"
version = "0.40.0"
description = "MCP server that lets AI coding agents (Claude Code, Codex, Cursor...) read, create, edit, run and test NI LabVIEW VIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noah Lim" }]
keywords = ["labview", "mcp", "mcp-server", "claude", "claude-code", "ni", "automation", "ai-agent", "test-automation"]
dependencies = [
    "mcp>=2.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pillow>=10",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/shlim-t/labview-mcp"
Issues = "https://github.com/shlim-t/labview-mcp/issues"

[project.scripts]
labview-mcp = "labview_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/labview_mcp"]
